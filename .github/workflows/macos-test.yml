name: macOS test installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Node runtime
        shell: bash
        run: |
          set -euo pipefail
          name="node-v22.22.0-darwin-${{ matrix.arch }}"
          mkdir -p work/runtime
          cd work/runtime
          curl --fail --location --retry 3 "https://nodejs.org/dist/v22.22.0/$name.tar.gz" -o "$name.tar.gz"
          curl --fail --location --retry 3 https://nodejs.org/dist/v22.22.0/SHASUMS256.txt -o SHASUMS256.txt
          grep "  $name.tar.gz$" SHASUMS256.txt | shasum -a 256 -c -
          tar -xzf "$name.tar.gz"
      - name: Build unsigned installer
        run: python3 installer/build-macos.py --arch ${{ matrix.arch }} --runtime work/runtime/node-v22.22.0-darwin-${{ matrix.arch }} --public-key installer/macos/update-public-key.txt --unsigned
      - name: Verify payload and execute native regression tests
        run: python3 scripts/verify-macos-package.py --arch ${{ matrix.arch }} --runtime work/runtime/node-v22.22.0-darwin-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-test-installer
          path: dist/macos/**/*
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-diagnostics
          path: work/macos-native-tests.tap
          if-no-files-found: ignore
