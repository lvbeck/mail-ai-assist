<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Mail AI Assist · Setup</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,sans-serif;background:#f5f7fb;color:#23304a;max-width:840px;margin:32px auto;padding:0 24px 32px}.language-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:14px 18px;margin-bottom:24px;background:white;border:1px solid #dce2ee;border-radius:14px}.language-toolbar label{font-weight:600;color:#596579;flex-shrink:0}.language-toolbar select{font:inherit;color:#23304a;background:#f8faff;border:1px solid #cbd5e4;border-radius:9px;padding:9px 12px;width:240px;min-width:0;max-width:100%}.language-toolbar select:focus-visible{outline:3px solid #c9d0ff;outline-offset:2px;border-color:#5967ce}main{background:white;padding:32px;border:1px solid #dce2ee;border-radius:18px;box-shadow:0 8px 28px #23304a06;overflow-wrap:anywhere}h1{display:flex;align-items:center;gap:14px;margin:0 0 28px;color:#4953bd;font-size:32px;line-height:1.3}h1 img{flex-shrink:0;color-scheme:light dark}h2{margin:0 0 18px;font-size:24px}li{margin:20px 0}a{color:#415cc8}aside{padding:18px 20px;background:#edf1ff;border-radius:12px;margin:24px 0}small{display:block;color:#596579;margin-top:24px}@media(max-width:520px){body{margin:20px auto;padding:0 16px 24px}.language-toolbar{padding:12px;gap:10px;margin-bottom:20px}.language-toolbar select{width:200px}main{padding:22px 20px}h1{font-size:26px;gap:12px}h1 img{width:44px;height:44px}h2{font-size:22px}}</style></head>
<body><div class="language-toolbar"><label id="languageLabel" for="language"></label><select id="language"><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option><option value="pt">Português (Portugal)</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div><main><h1><img src="icon.svg" width="52" height="52" alt="">Mail AI Assist</h1><h2 id="title"></h2><p id="intro"></p><ol><li><a href="Mail-AI-Assist.xpi" download="Mail-AI-Assist.xpi" id="download"></a></li><li id="step2"></li><li id="step3"></li></ol><aside id="updates"></aside><p id="uninstall"></p><small>Jin Lu · <a href="mailto:it@live.cn">it@live.cn</a> · MIT</small></main>
<script>
const texts={"en": ["Complete setup", "The local helper has been installed in the selected scope and folder. Please follow the steps below to complete the add-on installation:", "Save the Thunderbird add-on.", "Open Thunderbird. In Thunderbird, open Add-ons and Themes → Extensions → gear menu → Install Add-on From File. Select Mail-AI-Assist.xpi and confirm its permissions. You can also find this file next to this guide.", "Open AI Assist → Settings. Sign in with your own account or enter your API key, then choose a model.", "Automatic updates: Thunderbird checks for add-on updates according to its settings. When you use the assistant, the helper checks at most once a day. Current-user helper updates install after Thunderbird closes. For all-user installations, open AI Assist settings and click Install helper update, then close Thunderbird and approve the administrator prompt; no email content or login credentials are sent to the update server.", "Uninstall the helper through Windows Installed apps and remove the add-on separately in Thunderbird. Saved credentials are retained; sign out or remove API keys first if you want to clear them."], "de": ["Einrichtung abschließen", "Das lokale Hilfsprogramm wurde für den gewählten Benutzerkreis im ausgewählten Ordner installiert. Bitte führen Sie die folgenden Schritte aus, um die Installation des Add-ons abzuschließen:", "Thunderbird-Add-on speichern.", "Öffnen Sie Thunderbird. Öffnen Sie in Thunderbird Add-ons und Themes → Erweiterungen → Zahnradmenü → Add-on aus Datei installieren. Wählen Sie Mail-AI-Assist.xpi und bestätigen Sie die Berechtigungen. Die Datei liegt auch neben dieser Anleitung.", "Öffnen Sie KI-Assistent → Einstellungen. Melden Sie sich mit Ihrem eigenen Konto an oder geben Sie Ihren API-Schlüssel ein und wählen Sie ein Modell.", "Automatische Updates: Thunderbird prüft Add-on-Updates gemäß seinen Einstellungen. Bei Nutzung des Assistenten prüft das Hilfsprogramm höchstens einmal täglich auf Updates. Updates für den aktuellen Benutzer werden nach dem Schließen von Thunderbird installiert. Bei Installation für alle Benutzer klicken Sie in den KI-Assistent-Einstellungen auf Hilfsprogramm-Update installieren, schließen Thunderbird und bestätigen die Administratorabfrage. E-Mail-Inhalte und Zugangsdaten werden nicht an den Updateserver gesendet.", "Deinstallieren Sie das Hilfsprogramm über die installierten Windows-Apps und entfernen Sie das Add-on separat in Thunderbird. Zugangsdaten bleiben erhalten. Melden Sie sich vorher ab bzw. entfernen Sie API-Schlüssel, um diese zu löschen."], "zh-CN": ["完成安装", "本地辅助程序已按所选安装范围和路径安装，请按下列步骤完成插件安装：", "保存 Thunderbird 插件。", "请打开 Thunderbird，在 Thunderbird 中打开“附加组件和主题 → 扩展 → 齿轮菜单 → 从文件安装附加组件”，选择 Mail-AI-Assist.xpi 并确认权限。此文件也位于本说明所在目录。", "打开“AI 助手 → 设置”，登录自己的账户或填写 API Key，再选择模型。", "自动更新：Thunderbird 根据自身设置检查插件更新。使用助手时，辅助程序每天最多检查一次更新，当前用户模式在验证通过后等待 Thunderbird 关闭再安装；所有用户模式需在 AI 助手设置中点击“安装辅助程序更新”，关闭 Thunderbird 后确认管理员授权。更新服务器不会收到邮件正文或登录凭据。", "在 Windows 已安装的应用中卸载辅助程序，并在 Thunderbird 中单独移除插件。卸载保留登录凭据；如需清除，请先在插件设置中退出登录、移除 API Key。"], "zh-TW": ["完成安裝", "本機輔助程式已依所選安裝範圍及路徑安裝，請依照下列步驟完成附加元件安裝：", "儲存 Thunderbird 附加元件。", "請開啟 Thunderbird，在 Thunderbird 開啟「附加元件與佈景主題 → 擴充套件 → 齒輪選單 → 從檔案安裝附加元件」，選取 Mail-AI-Assist.xpi 並確認權限。此檔案也位於本說明所在目錄。", "開啟「AI 助手 → 設定」，登入自己的帳戶或填寫 API Key，再選擇模型。", "自動更新：Thunderbird 根據自身設定檢查附加元件更新。使用助手時，輔助程式每天最多檢查一次更新，目前使用者模式在驗證通過後等待 Thunderbird 關閉再安裝；所有使用者模式需在 AI 助手設定中點擊「安裝輔助程式更新」，關閉 Thunderbird 後確認管理員授權。更新伺服器不會收到郵件正文或登入憑據。", "在 Windows 已安裝的應用程式中解除安裝輔助程式，並在 Thunderbird 中單獨移除附加元件。解除安裝保留登入憑據；如需清除，請先在設定中登出、移除 API Key。"], "fr": ["Terminer l’installation", "L’assistant local a été installé pour les utilisateurs et dans le dossier choisis. Veuillez suivre les étapes ci-dessous pour terminer l’installation du module complémentaire :", "Enregistrer le module Thunderbird.", "Ouvrez Thunderbird. Dans Thunderbird, ouvrez Modules complémentaires et thèmes → Extensions → menu engrenage → Installer un module depuis un fichier. Sélectionnez Mail-AI-Assist.xpi et confirmez les autorisations. Ce fichier se trouve aussi à côté de ce guide.", "Ouvrez Assistant IA → Paramètres. Connectez votre compte ou saisissez votre clé API, puis choisissez un modèle.", "Mises à jour automatiques : Thunderbird recherche les mises à jour du module selon ses paramètres. Lorsque vous utilisez l’assistant, le programme local vérifie les mises à jour au maximum une fois par jour. Les mises à jour pour l’utilisateur actuel s’installent après la fermeture de Thunderbird. Pour une installation pour tous les utilisateurs, cliquez sur Installer la mise à jour de l’assistant local dans les paramètres, fermez Thunderbird et approuvez la demande administrateur. Aucun contenu d’e-mail ni identifiant n’est envoyé au serveur de mises à jour.", "Désinstallez l’assistant local dans les applications installées de Windows et retirez le module séparément dans Thunderbird. Les identifiants sont conservés ; déconnectez-vous ou retirez les clés API au préalable pour les effacer."], "it": ["Completa l’installazione", "Il programma di supporto locale è stato installato per gli utenti e nella cartella selezionati. Segui i passaggi riportati di seguito per completare l’installazione del componente aggiuntivo:", "Salva il componente aggiuntivo Thunderbird.", "Apri Thunderbird. In Thunderbird, apri Componenti aggiuntivi e temi → Estensioni → menu ingranaggio → Installa componente aggiuntivo da file. Seleziona Mail-AI-Assist.xpi e conferma i permessi. Il file si trova anche accanto a questa guida.", "Apri Assistente IA → Impostazioni. Accedi con il tuo account o inserisci la chiave API, poi scegli un modello.", "Aggiornamenti automatici: Thunderbird controlla gli aggiornamenti del componente secondo le proprie impostazioni. Quando usi l’assistente, il programma locale controlla al massimo una volta al giorno. Gli aggiornamenti per l’utente corrente si installano dopo la chiusura di Thunderbird. Per installazioni per tutti gli utenti, fai clic su Installa aggiornamento del programma di supporto nelle impostazioni, chiudi Thunderbird e approva la richiesta di amministratore. Il server di aggiornamento non riceve contenuti delle e-mail né credenziali.", "Disinstalla il programma di supporto dalle app installate di Windows e rimuovi separatamente il componente da Thunderbird. Le credenziali vengono conservate; esci dall’account o rimuovi prima le chiavi API per cancellarle."], "es": ["Completar la instalación", "El programa auxiliar local se ha instalado para los usuarios y en la carpeta seleccionados. Sigue los pasos que se indican a continuación para completar la instalación del complemento:", "Guardar el complemento de Thunderbird.", "Abre Thunderbird. En Thunderbird, abre Complementos y temas → Extensiones → menú del engranaje → Instalar complemento desde archivo. Selecciona Mail-AI-Assist.xpi y confirma sus permisos. El archivo también se encuentra junto a esta guía.", "Abre Asistente IA → Configuración. Inicia sesión con tu cuenta o introduce tu clave API y elige un modelo.", "Actualizaciones automáticas: Thunderbird busca actualizaciones del complemento según su configuración. Al usar el asistente, el programa auxiliar las comprueba como máximo una vez al día. Las actualizaciones para el usuario actual se instalan al cerrar Thunderbird. Para instalaciones para todos los usuarios, pulsa Instalar actualización del programa auxiliar en Configuración, cierra Thunderbird y aprueba la solicitud de administrador. No se envían contenidos de correo ni credenciales al servidor de actualizaciones.", "Desinstala el programa auxiliar desde las aplicaciones instaladas de Windows y elimina el complemento por separado en Thunderbird. Las credenciales se conservan; cierra sesión o elimina las claves API antes si quieres borrarlas."], "pt": ["Concluir a instalação", "O programa auxiliar local foi instalado para os utilizadores e na pasta selecionados. Siga os passos abaixo para concluir a instalação do extra:", "Guardar o extra do Thunderbird.", "Abra o Thunderbird. No Thunderbird, abra Extras e temas → Extensões → menu da roda dentada → Instalar extra a partir de ficheiro. Selecione Mail-AI-Assist.xpi e confirme as permissões. O ficheiro também está junto deste guia.", "Abra Assistente IA → Definições. Inicie sessão com a sua conta ou introduza a chave API e escolha um modelo.", "Atualizações automáticas: o Thunderbird verifica as atualizações do extra de acordo com as suas definições. Ao usar o assistente, o programa auxiliar verifica no máximo uma vez por dia. As atualizações para o utilizador atual são instaladas após fechar o Thunderbird. Nas instalações para todos os utilizadores, clique em Instalar atualização do programa auxiliar nas Definições, feche o Thunderbird e aprove o pedido de administrador. Não são enviados conteúdos de e-mail nem credenciais ao servidor de atualizações.", "Desinstale o programa auxiliar nas aplicações instaladas do Windows e remova o extra separadamente no Thunderbird. As credenciais são mantidas; termine sessão ou remova as chaves API antes, se as quiser eliminar."], "ja": ["セットアップを完了", "ローカルヘルパーを選択した範囲とフォルダーにインストールしました。次の手順でアドオンの設定を完了してください。", "Thunderbird アドオンを保存します。", "Thunderbird を開き、「アドオンとテーマ → 拡張機能 → 歯車メニュー → ファイルからアドオンをインストール」で Mail-AI-Assist.xpi を選択し、権限を確認してください。このファイルは本ガイドと同じフォルダーにもあります。", "「AI アシスタント → 設定」を開き、ご自身のアカウントでログインするか API キーを入力し、モデルを選択してください。", "自動更新：Thunderbird は設定に従ってアドオンの更新を確認します。ヘルパーは利用時に 1 日 1 回まで更新を確認します。現在のユーザー向け更新は Thunderbird 終了後にインストールします。全ユーザー向けの場合は AI アシスタントの設定で「ヘルパーの更新をインストール」をクリックし、Thunderbird を終了して管理者権限を許可してください。更新サーバーにメール内容や認証情報は送信しません。", "Windows の「インストールされているアプリ」からヘルパーを削除し、Thunderbird 内でアドオンを別途削除してください。保存した認証情報は保持します。削除したい場合は先にログアウトするか API キーを削除してください。"], "ko": ["설정 완료", "선택한 범위와 폴더에 로컬 도우미를 설치했습니다. 다음 단계에 따라 부가 기능 설정을 완료하세요.", "Thunderbird 부가 기능을 저장하세요.", "Thunderbird에서 부가 기능 및 테마 → 확장 기능 → 톱니바퀴 메뉴 → 파일에서 부가 기능 설치를 열고 Mail-AI-Assist.xpi를 선택한 후 권한을 확인하세요. 이 파일은 이 안내서와 같은 폴더에도 있습니다.", "AI 도우미 → 설정을 열고 본인 계정으로 로그인하거나 API 키를 입력한 후 모델을 선택하세요.", "자동 업데이트: Thunderbird는 설정에 따라 부가 기능 업데이트를 확인합니다. 도우미는 사용 시 하루에 최대 한 번 업데이트를 확인합니다. 현재 사용자용 업데이트는 Thunderbird 종료 후 설치됩니다. 모든 사용자용 설치는 AI 도우미 설정에서 도우미 업데이트 설치를 클릭하고 Thunderbird를 종료한 후 관리자 권한을 승인하세요. 메일 내용이나 로그인 정보는 업데이트 서버로 전송하지 않습니다.", "Windows의 설치된 앱에서 도우미를 제거하고 Thunderbird에서 부가 기능을 별도로 제거하세요. 저장된 인증 정보는 유지됩니다. 지우려면 먼저 로그아웃하거나 API 키를 제거하세요."]};
const labels={"en": "Language", "de": "Sprache", "zh-CN": "语言", "zh-TW": "語言", "fr": "Langue", "it": "Lingua", "es": "Idioma", "pt": "Idioma", "ja": "言語", "ko": "언어"};
function matchLanguage(value){const tag=String(value||'').replaceAll('_','-').toLowerCase();if(tag.startsWith('zh'))return /hant|tw|hk|mo/.test(tag)?'zh-TW':'zh-CN';const base=tag.split('-')[0];return Object.hasOwn(texts,base)?base:'en';}
const selector=document.getElementById('language');
selector.value=matchLanguage(navigator.language);

function render(){const lang=selector.value;document.documentElement.lang=lang;document.title='Mail AI Assist · '+texts[lang][0];document.getElementById('languageLabel').textContent=labels[lang];['title','intro','download','step2','step3','updates','uninstall'].forEach((id,i)=>document.getElementById(id).textContent=texts[lang][i]);}
selector.addEventListener('change',render);render();
</script></body></html>
