const texts={"en": ["Complete setup", "The local helper has been installed in the selected scope and folder. Please follow the steps below to complete the add-on installation:", "Save the Thunderbird add-on.", "Open Thunderbird. In Thunderbird, open Add-ons and Themes → Extensions → gear menu → Install Add-on From File. Select Mail-AI-Assist.xpi and confirm its permissions. You can also find this file next to this guide.", "Open AI Assist → Settings. Sign in with your own account or enter your API key, then choose a model.", "Automatic updates: Thunderbird checks for add-on updates according to its settings. When you use the assistant, the helper checks at most once a day. Current-user helper updates install after Thunderbird closes. For all-user installations, open AI Assist settings and click Install helper update, then close Thunderbird and approve the administrator prompt; no email content or login credentials are sent to the update server.", "Uninstall the helper through Windows Installed apps and remove the add-on separately in Thunderbird. Saved credentials are retained; sign out or remove API keys first if you want to clear them."], "de": ["Einrichtung abschließen", "Das lokale Hilfsprogramm wurde für den gewählten Benutzerkreis im ausgewählten Ordner installiert. Bitte führen Sie die folgenden Schritte aus, um die Installation des Add-ons abzuschließen:", "Thunderbird-Add-on speichern.", "Öffnen Sie Thunderbird. Öffnen Sie in Thunderbird Add-ons und Themes → Erweiterungen → Zahnradmenü → Add-on aus Datei installieren. Wählen Sie Mail-AI-Assist.xpi und bestätigen Sie die Berechtigungen. Die Datei liegt auch neben dieser Anleitung.", "Öffnen Sie KI-Assistent → Einstellungen. Melden Sie sich mit Ihrem eigenen Konto an oder geben Sie Ihren API-Schlüssel ein und wählen Sie ein Modell.", "Automatische Updates: Thunderbird prüft Add-on-Updates gemäß seinen Einstellungen. Bei Nutzung des Assistenten prüft das Hilfsprogramm höchstens einmal täglich auf Updates. Updates für den aktuellen Benutzer werden nach dem Schließen von Thunderbird installiert. Bei Installation für alle Benutzer klicken Sie in den KI-Assistent-Einstellungen auf Hilfsprogramm-Update installieren, schließen Thunderbird und bestätigen die Administratorabfrage. E-Mail-Inhalte und Zugangsdaten werden nicht an den Updateserver gesendet.", "Deinstallieren Sie das Hilfsprogramm über die installierten Windows-Apps und entfernen Sie das Add-on separat in Thunderbird. Zugangsdaten bleiben erhalten. Melden Sie sich vorher ab bzw. entfernen Sie API-Schlüssel, um diese zu löschen."], "zh-CN": ["完成安装", "本地辅助程序已按所选安装范围和路径安装，请按下列步骤完成插件安装：", "保存 Thunderbird 插件。", "请打开 Thunderbird，在 Thunderbird 中打开“附加组件和主题 → 扩展 → 齿轮菜单 → 从文件安装附加组件”，选择 Mail-AI-Assist.xpi 并确认权限。此文件也位于本说明所在目录。", "打开“AI 助手 → 设置”，登录自己的账户或填写 API Key，再选择模型。", "自动更新：Thunderbird 根据自身设置检查插件更新。使用助手时，辅助程序每天最多检查一次更新，当前用户模式在验证通过后等待 Thunderbird 关闭再安装；所有用户模式需在 AI 助手设置中点击“安装辅助程序更新”，关闭 Thunderbird 后确认管理员授权。更新服务器不会收到邮件正文或登录凭据。", "在 Windows 已安装的应用中卸载辅助程序，并在 Thunderbird 中单独移除插件。卸载保留登录凭据；如需清除，请先在插件设置中退出登录、移除 API Key。"], "zh-TW": ["完成安裝", "本機輔助程式已依所選安裝範圍及路徑安裝，請依照下列步驟完成附加元件安裝：", "儲存 Thunderbird 附加元件。", "請開啟 Thunderbird，在 Thunderbird 開啟「附加元件與佈景主題 → 擴充套件 → 齒輪選單 → 從檔案安裝附加元件」，選取 Mail-AI-Assist.xpi 並確認權限。此檔案也位於本說明所在目錄。", "開啟「AI 助手 → 設定」，登入自己的帳戶或填寫 API Key，再選擇模型。", "自動更新：Thunderbird 根據自身設定檢查附加元件更新。使用助手時，輔助程式每天最多檢查一次更新，目前使用者模式在驗證通過後等待 Thunderbird 關閉再安裝；所有使用者模式需在 AI 助手設定中點擊「安裝輔助程式更新」，關閉 Thunderbird 後確認管理員授權。更新伺服器不會收到郵件正文或登入憑據。", "在 Windows 已安裝的應用程式中解除安裝輔助程式，並在 Thunderbird 中單獨移除附加元件。解除安裝保留登入憑據；如需清除，請先在設定中登出、移除 API Key。"], "fr": ["Terminer l’installation", "L’assistant local a été installé pour les utilisateurs et dans le dossier choisis. Veuillez suivre les étapes ci-dessous pour terminer l’installation du module complémentaire :", "Enregistrer le module Thunderbird.", "Ouvrez Thunderbird. Dans Thunderbird, ouvrez Modules complémentaires et thèmes → Extensions → menu engrenage → Installer un module depuis un fichier. Sélectionnez Mail-AI-Assist.xpi et confirmez les autorisations. Ce fichier se trouve aussi à côté de ce guide.", "Ouvrez Assistant IA → Paramètres. Connectez votre compte ou saisissez votre clé API, puis choisissez un modèle.", "Mises à jour automatiques : Thunderbird recherche les mises à jour du module selon ses paramètres. Lorsque vous utilisez l’assistant, le programme local vérifie les mises à jour au maximum une fois par jour. Les mises à jour pour l’utilisateur actuel s’installent après la fermeture de Thunderbird. Pour une installation pour tous les utilisateurs, cliquez sur Installer la mise à jour de l’assistant local dans les paramètres, fermez Thunderbird et approuvez la demande administrateur. Aucun contenu d’e-mail ni identifiant n’est envoyé au serveur de mises à jour.", "Désinstallez l’assistant local dans les applications installées de Windows et retirez le module séparément dans Thunderbird. Les identifiants sont conservés ; déconnectez-vous ou retirez les clés API au préalable pour les effacer."], "it": ["Completa l’installazione", "Il programma di supporto locale è stato installato per gli utenti e nella cartella selezionati. Segui i passaggi riportati di seguito per completare l’installazione del componente aggiuntivo:", "Salva il componente aggiuntivo Thunderbird.", "Apri Thunderbird. In Thunderbird, apri Componenti aggiuntivi e temi → Estensioni → menu ingranaggio → Installa componente aggiuntivo da file. Seleziona Mail-AI-Assist.xpi e conferma i permessi. Il file si trova anche accanto a questa guida.", "Apri Assistente IA → Impostazioni. Accedi con il tuo account o inserisci la chiave API, poi scegli un modello.", "Aggiornamenti automatici: Thunderbird controlla gli aggiornamenti del componente secondo le proprie impostazioni. Quando usi l’assistente, il programma locale controlla al massimo una volta al giorno. Gli aggiornamenti per l’utente corrente si installano dopo la chiusura di Thunderbird. Per installazioni per tutti gli utenti, fai clic su Installa aggiornamento del programma di supporto nelle impostazioni, chiudi Thunderbird e approva la richiesta di amministratore. Il server di aggiornamento non riceve contenuti delle e-mail né credenziali.", "Disinstalla il programma di supporto dalle app installate di Windows e rimuovi separatamente il componente da Thunderbird. Le credenziali vengono conservate; esci dall’account o rimuovi prima le chiavi API per cancellarle."], "es": ["Completar la instalación", "El programa auxiliar local se ha instalado para los usuarios y en la carpeta seleccionados. Sigue los pasos que se indican a continuación para completar la instalación del complemento:", "Guardar el complemento de Thunderbird.", "Abre Thunderbird. En Thunderbird, abre Complementos y temas → Extensiones → menú del engranaje → Instalar complemento desde archivo. Selecciona Mail-AI-Assist.xpi y confirma sus permisos. El archivo también se encuentra junto a esta guía.", "Abre Asistente IA → Configuración. Inicia sesión con tu cuenta o introduce tu clave API y elige un modelo.", "Actualizaciones automáticas: Thunderbird busca actualizaciones del complemento según su configuración. Al usar el asistente, el programa auxiliar las comprueba como máximo una vez al día. Las actualizaciones para el usuario actual se instalan al cerrar Thunderbird. Para instalaciones para todos los usuarios, pulsa Instalar actualización del programa auxiliar en Configuración, cierra Thunderbird y aprueba la solicitud de administrador. No se envían contenidos de correo ni credenciales al servidor de actualizaciones.", "Desinstala el programa auxiliar desde las aplicaciones instaladas de Windows y elimina el complemento por separado en Thunderbird. Las credenciales se conservan; cierra sesión o elimina las claves API antes si quieres borrarlas."], "pt": ["Concluir a instalação", "O programa auxiliar local foi instalado para os utilizadores e na pasta selecionados. Siga os passos abaixo para concluir a instalação do extra:", "Guardar o extra do Thunderbird.", "Abra o Thunderbird. No Thunderbird, abra Extras e temas → Extensões → menu da roda dentada → Instalar extra a partir de ficheiro. Selecione Mail-AI-Assist.xpi e confirme as permissões. O ficheiro também está junto deste guia.", "Abra Assistente IA → Definições. Inicie sessão com a sua conta ou introduza a chave API e escolha um modelo.", "Atualizações automáticas: o Thunderbird verifica as atualizações do extra de acordo com as suas definições. Ao usar o assistente, o programa auxiliar verifica no máximo uma vez por dia. As atualizações para o utilizador atual são instaladas após fechar o Thunderbird. Nas instalações para todos os utilizadores, clique em Instalar atualização do programa auxiliar nas Definições, feche o Thunderbird e aprove o pedido de administrador. Não são enviados conteúdos de e-mail nem credenciais ao servidor de atualizações.", "Desinstale o programa auxiliar nas aplicações instaladas do Windows e remova o extra separadamente no Thunderbird. As credenciais são mantidas; termine sessão ou remova as chaves API antes, se as quiser eliminar."], "ja": ["セットアップを完了", "ローカルヘルパーを選択した範囲とフォルダーにインストールしました。次の手順でアドオンの設定を完了してください。", "Thunderbird アドオンを保存します。", "Thunderbird を開き、「アドオンとテーマ → 拡張機能 → 歯車メニュー → ファイルからアドオンをインストール」で Mail-AI-Assist.xpi を選択し、権限を確認してください。このファイルは本ガイドと同じフォルダーにもあります。", "「AI アシスタント → 設定」を開き、ご自身のアカウントでログインするか API キーを入力し、モデルを選択してください。", "自動更新：Thunderbird は設定に従ってアドオンの更新を確認します。ヘルパーは利用時に 1 日 1 回まで更新を確認します。現在のユーザー向け更新は Thunderbird 終了後にインストールします。全ユーザー向けの場合は AI アシスタントの設定で「ヘルパーの更新をインストール」をクリックし、Thunderbird を終了して管理者権限を許可してください。更新サーバーにメール内容や認証情報は送信しません。", "Windows の「インストールされているアプリ」からヘルパーを削除し、Thunderbird 内でアドオンを別途削除してください。保存した認証情報は保持します。削除したい場合は先にログアウトするか API キーを削除してください。"], "ko": ["설정 완료", "선택한 범위와 폴더에 로컬 도우미를 설치했습니다. 다음 단계에 따라 부가 기능 설정을 완료하세요.", "Thunderbird 부가 기능을 저장하세요.", "Thunderbird에서 부가 기능 및 테마 → 확장 기능 → 톱니바퀴 메뉴 → 파일에서 부가 기능 설치를 열고 Mail-AI-Assist.xpi를 선택한 후 권한을 확인하세요. 이 파일은 이 안내서와 같은 폴더에도 있습니다.", "AI 도우미 → 설정을 열고 본인 계정으로 로그인하거나 API 키를 입력한 후 모델을 선택하세요.", "자동 업데이트: Thunderbird는 설정에 따라 부가 기능 업데이트를 확인합니다. 도우미는 사용 시 하루에 최대 한 번 업데이트를 확인합니다. 현재 사용자용 업데이트는 Thunderbird 종료 후 설치됩니다. 모든 사용자용 설치는 AI 도우미 설정에서 도우미 업데이트 설치를 클릭하고 Thunderbird를 종료한 후 관리자 권한을 승인하세요. 메일 내용이나 로그인 정보는 업데이트 서버로 전송하지 않습니다.", "Windows의 설치된 앱에서 도우미를 제거하고 Thunderbird에서 부가 기능을 별도로 제거하세요. 저장된 인증 정보는 유지됩니다. 지우려면 먼저 로그아웃하거나 API 키를 제거하세요."]};

const overviews={"en": "<p>Mail AI Assist helps you work with emails you select in Thunderbird: summarize or translate a message, suggest tags, rewrite selected text in a draft, and export email locally. It does not proactively scan your entire mailbox. Automatic summaries and tags run only for new inbox messages in accounts where you explicitly enable each feature.</p><h2>Features</h2><ul><li><strong>Email summaries:</strong> Open AI Summary for the selected message to extract its main points and action items. Choose the summary language independently of the interface and translation languages; the default follows the system language.</li><li><strong>Email translation:</strong> Select source and target languages, or detect the source language automatically. Use Google Cloud Translation, Microsoft Azure Translator or DeepL with your own API key; without a configured translation service, translation uses the selected AI model.</li><li><strong>Tag suggestions and aliases:</strong> Prefer existing Thunderbird tags instead of creating near-duplicates. Review and edit manual suggestions before confirming. In Settings, map names such as <code>Project Alpha</code> and <code>Project Beta</code> to the existing <code>Projects</code> tag. Alias matching ignores case and extra spaces and matches complete names.</li><li><strong>Selected-text rewriting:</strong> Select text in a compose or reply window, request a rewrite, review the preview, then explicitly replace the selection. The add-on never sends emails automatically.</li><li><strong>Local email export:</strong> TXT exports email content and can exclude quoted replies and forwards. EML preserves the complete original message, encoding, headers, formatting and attachments; quoted content cannot be excluded. Export itself does not call an AI model or consume tokens. Choose an export folder and target desktop application; the helper reveals the file for you to drag or attach manually. It does not attach or send the file automatically. Closing the dialog keeps exported files.</li><li><strong>Persistent cache:</strong> Matching summaries and translations are reused when reopened, including after restarting Thunderbird. Retry requests a fresh result and updates the cache. Settings lets you view cache usage, open its folder or clear it; managed export files can be cleared separately.</li><li><strong>Ten interface languages:</strong> English, German, French, Italian, Spanish, Portuguese, Simplified Chinese, Traditional Chinese, Japanese and Korean.</li></ul><h2>Optional automation for new mail</h2><p>Both automatic summaries and automatic tags are <strong>off by default for every account</strong>. Right-click an account in Thunderbird and use the AI Assistant menu to enable either feature independently. Only newly received inbox messages in enabled accounts are processed; historical messages are not scanned, and messages already marked as junk are skipped.</p><p>Automatic summaries are saved to the cache for later viewing. Automatic tags are applied directly, using existing tags and alias rules; unlike manual suggestions, they do not require confirmation for each message. Automation uses your selected provider, model and relevant output language, sends message content to that service, and consumes its quota. The automatic-summary limit defaults to 100 attempts per account per day and is configurable; failed or cancelled attempts also count. This limit applies to summaries, not automatic tags.</p><p>Summary, translation and tagging process the message subject and body, not attachment contents. AI results may contain errors and should be reviewed before relying on them.</p><h2>Providers and privacy</h2><p>Choose ChatGPT authorization, Gemini API or Claude API. Translation supports Google Cloud Translation, Azure Translator and DeepL; when no translation service is selected/configured, it uses the selected AI model. Service failures do not silently switch providers. Eligibility and charges depend on the provider. Relevant email content is sent to the selected service through the Windows helper. Credentials use Windows DPAPI; cache and exports are readable local files. See <a href=\"https://github.com/lvbeck/mail-ai-assist/blob/main/publication/PRIVACY.md\">privacy policy</a>.</p>", "de": "<p>Mail AI Assist unterstützt Sie bei ausgewählten E-Mails in Thunderbird: Nachrichten zusammenfassen oder übersetzen, Schlagwörter vorschlagen, markierten Text beim Verfassen überarbeiten und E-Mails lokal exportieren. Das Add-on durchsucht nicht selbstständig das gesamte Postfach. Automatische Zusammenfassungen und Schlagwörter werden nur für neue Posteingangsnachrichten in Konten erstellt, für die Sie die jeweilige Funktion ausdrücklich aktivieren.</p><h2>Funktionen</h2><ul><li><strong>Zusammenfassungen:</strong> Erfassen Sie die wichtigsten Punkte und Aufgaben einer ausgewählten Nachricht. Die Ausgabesprache ist unabhängig von der Oberflächen- und Übersetzungssprache; standardmäßig folgt sie der Systemsprache.</li><li><strong>Übersetzung:</strong> Wählen Sie Quell- und Zielsprache oder lassen Sie die Quellsprache automatisch erkennen. Google Cloud Translation, Microsoft Azure Translator und DeepL lassen sich mit eigenen API-Schlüsseln nutzen. Ohne konfigurierten Übersetzungsdienst wird das ausgewählte KI-Modell verwendet.</li><li><strong>Schlagwörter und Aliasse:</strong> Vorhandene Thunderbird-Schlagwörter werden bevorzugt, um ähnliche Neuanlagen zu vermeiden. Manuelle Vorschläge können vor der Bestätigung bearbeitet werden. Ordnen Sie beispielsweise <code>Project Alpha</code> und <code>Project Beta</code> dem vorhandenen Schlagwort <code>Projects</code> zu. Regeln vergleichen vollständige Namen und ignorieren Groß-/Kleinschreibung sowie überzählige Leerzeichen.</li><li><strong>Markierten Text überarbeiten:</strong> Markieren Sie Text beim Verfassen oder Antworten, prüfen Sie die Vorschau und bestätigen Sie das Ersetzen. Das Add-on versendet niemals automatisch E-Mails.</li><li><strong>Lokaler Export:</strong> TXT exportiert den Inhalt und kann zitierte Antworten und Weiterleitungen ausschließen. EML bewahrt die vollständige Originalnachricht mit Kodierung, Kopfzeilen, Formatierung und Anhängen; Zitate bleiben enthalten. Der Export nutzt keine KI und verbraucht keine Token. Wählen Sie Ordner und Desktop-Anwendung; die Datei wird im Dateimanager markiert, damit Sie sie manuell in einen Chat ziehen oder anhängen können. Kein automatisches Anhängen oder Senden. Beim Schließen bleiben Dateien erhalten.</li><li><strong>Dauerhafter Cache:</strong> Passende Zusammenfassungen und Übersetzungen werden beim erneuten Öffnen wiederverwendet, auch nach einem Thunderbird-Neustart. „Erneut versuchen“ fordert ein neues Ergebnis an und aktualisiert den Cache. In den Einstellungen können Sie Größe anzeigen, den Ordner öffnen oder den Cache leeren; Exporte lassen sich separat bereinigen.</li><li><strong>Zehn Oberflächensprachen:</strong> Englisch, Deutsch, Französisch, Italienisch, Spanisch, Portugiesisch, vereinfachtes und traditionelles Chinesisch, Japanisch und Koreanisch.</li></ul><h2>Optionale Automatisierung für neue Nachrichten</h2><p>Automatische Zusammenfassungen und Schlagwörter sind für alle Konten <strong>standardmäßig deaktiviert</strong>. Aktivieren Sie beide Funktionen unabhängig voneinander über das KI-Assistent-Menü beim Rechtsklick auf ein Konto. Nur neu eingegangene Posteingangsnachrichten aktivierter Konten werden verarbeitet. Alte Nachrichten werden nicht durchsucht; bereits als Junk markierte Nachrichten werden übersprungen.</p><p>Automatische Zusammenfassungen werden zur späteren Anzeige zwischengespeichert. Automatische Schlagwörter werden anhand bestehender Schlagwörter und Aliasregeln direkt angewendet, ohne Einzelbestätigung wie bei manuellen Vorschlägen. Dabei werden der gewählte Anbieter, das Modell und die jeweilige Ausgabesprache verwendet; Nachrichteninhalte werden an diesen Dienst übermittelt und dessen Kontingent wird verbraucht. Für automatische Zusammenfassungen gelten standardmäßig 100 Versuche pro Konto und Tag, in den Einstellungen anpassbar. Fehlgeschlagene oder abgebrochene Versuche zählen mit. Dieses Limit gilt nicht für automatische Schlagwörter.</p><p>Zusammenfassung, Übersetzung und Verschlagwortung verarbeiten Betreff und Nachrichtentext, nicht den Inhalt von Anhängen. Prüfen Sie KI-Ergebnisse, da sie Fehler enthalten können.</p><h2>Anbieter und Datenschutz</h2><p>ChatGPT-Autorisierung, Gemini API und Claude API werden unterstützt. Übersetzungen können Google Cloud Translation, Azure Translator oder DeepL verwenden; ohne konfigurierten Übersetzungsdienst wird das gewählte KI-Modell genutzt. Fehler lösen keinen Anbieterwechsel aus. Berechtigung und Kosten richten sich nach dem Anbieter. Relevante Inhalte gelangen über das Windows-Hilfsprogramm zum gewählten Dienst. Zugangsdaten sind mit DPAPI geschützt, Cache und Exporte lokal lesbar. Siehe <a href=\"https://github.com/lvbeck/mail-ai-assist/blob/main/publication/PRIVACY.md\">Datenschutz</a>.</p>", "fr": "<p>Mail AI Assist vous aide à traiter les messages sélectionnés dans Thunderbird : résumés, traduction, suggestions d’étiquettes, reformulation du texte sélectionné pendant la rédaction et export local. L’extension ne parcourt pas spontanément toute votre boîte mail. Les résumés et étiquettes automatiques concernent uniquement les nouveaux messages de la boîte de réception des comptes pour lesquels vous activez explicitement chaque fonction.</p><h2>Fonctionnalités</h2><ul><li><strong>Résumés :</strong> Retrouvez les points essentiels et les actions à effectuer dans le message sélectionné. La langue du résumé est indépendante de celles de l’interface et de la traduction ; elle suit par défaut la langue du système.</li><li><strong>Traduction :</strong> Choisissez les langues source et cible, ou détectez automatiquement la langue source. Configurez Google Cloud Translation, Microsoft Azure Translator ou DeepL avec votre propre clé API. Sans service de traduction configuré, le modèle d’IA sélectionné est utilisé.</li><li><strong>Étiquettes et alias :</strong> Réutilisez en priorité les étiquettes Thunderbird existantes pour limiter les doublons proches. Les suggestions manuelles sont modifiables avant confirmation. Associez par exemple <code>Project Alpha</code> et <code>Project Beta</code> à l’étiquette existante <code>Projects</code>. Les règles comparent les noms complets, sans tenir compte de la casse ni des espaces superflus.</li><li><strong>Reformulation :</strong> Sélectionnez du texte dans une nouvelle rédaction ou une réponse, examinez l’aperçu, puis confirmez son remplacement. L’extension n’envoie jamais les messages automatiquement.</li><li><strong>Export local :</strong> TXT exporte le contenu et permet d’exclure les réponses citées et les transferts. EML conserve le message original complet, son encodage, ses en-têtes, sa mise en forme et ses pièces jointes, sans exclure les citations. L’export ne fait pas appel à l’IA et ne consomme aucun token. Choisissez le dossier et l’application de bureau ; le fichier est sélectionné dans l’explorateur pour être glissé ou joint manuellement à une conversation. Aucune pièce jointe ni aucun envoi automatique. Fermer la fenêtre conserve les fichiers.</li><li><strong>Cache persistant :</strong> Les résumés et traductions correspondants sont réutilisés à la réouverture, même après un redémarrage de Thunderbird. Réessayer demande un nouveau résultat et actualise le cache. Les paramètres permettent de consulter sa taille, d’ouvrir son dossier ou de le vider ; les exports se nettoient séparément.</li><li><strong>Dix langues d’interface :</strong> anglais, allemand, français, italien, espagnol, portugais, chinois simplifié et traditionnel, japonais et coréen.</li></ul><h2>Automatisation facultative des nouveaux messages</h2><p>Les résumés et étiquettes automatiques sont <strong>désactivés par défaut pour chaque compte</strong>. Activez-les séparément dans le menu de l’assistant IA accessible par clic droit sur le compte. Seuls les nouveaux messages reçus dans la boîte de réception des comptes activés sont traités, sans analyser l’historique ; les messages déjà marqués comme indésirables sont ignorés.</p><p>Les résumés automatiques sont conservés en cache pour consultation ultérieure. Les étiquettes automatiques sont appliquées directement selon les étiquettes existantes et les alias, sans confirmation pour chaque message, contrairement aux suggestions manuelles. L’automatisation utilise le fournisseur, le modèle et la langue de sortie choisis, transmet le contenu au service et consomme son quota. La limite des résumés automatiques est de 100 tentatives par compte et par jour par défaut, modifiable dans les paramètres. Les échecs et annulations comptent aussi. Cette limite ne concerne pas les étiquettes automatiques.</p><p>Les résumés, traductions et étiquettes traitent l’objet et le corps du message, pas le contenu des pièces jointes. Vérifiez les résultats de l’IA avant de vous y fier.</p><h2>Services et confidentialité</h2><p>Autorisation ChatGPT, Gemini API et Claude API sont pris en charge. La traduction peut utiliser Google Cloud Translation, Azure Translator ou DeepL ; sans service configuré, le modèle IA choisi est utilisé. Aucun changement de fournisseur après une erreur. Accès et coûts dépendent du fournisseur. Les contenus pertinents passent par l’assistant Windows vers le service choisi. Identifiants protégés par DPAPI ; cache et exports lisibles localement. Voir la <a href=\"https://github.com/lvbeck/mail-ai-assist/blob/main/publication/PRIVACY.md\">politique</a>.</p>", "it": "<p>Mail AI Assist aiuta a elaborare le email selezionate in Thunderbird: riassunti, traduzioni, suggerimenti di etichette, riscrittura del testo selezionato durante la composizione ed esportazione locale. Non esegue scansioni autonome dell’intera casella. Riassunti ed etichette automatici riguardano solo i nuovi messaggi in arrivo negli account per cui abiliti esplicitamente ciascuna funzione.</p><h2>Funzionalità</h2><ul><li><strong>Riassunti:</strong> Estrai i punti principali e le attività da svolgere dal messaggio selezionato. La lingua del riassunto è indipendente da quelle dell’interfaccia e della traduzione; per impostazione predefinita segue il sistema.</li><li><strong>Traduzione:</strong> Scegli le lingue di origine e destinazione oppure rileva automaticamente quella di origine. Configura Google Cloud Translation, Microsoft Azure Translator o DeepL con la tua chiave API. Senza un servizio configurato viene usato il modello IA selezionato.</li><li><strong>Etichette e alias:</strong> Riutilizza preferibilmente le etichette Thunderbird esistenti per evitare duplicati simili. Modifica i suggerimenti manuali prima di confermarli. Associa, ad esempio, <code>Project Alpha</code> e <code>Project Beta</code> all’etichetta esistente <code>Projects</code>. Le regole confrontano nomi completi ignorando maiuscole, minuscole e spazi superflui.</li><li><strong>Riscrittura del testo selezionato:</strong> Seleziona il testo mentre componi o rispondi, controlla l’anteprima e conferma la sostituzione. L’estensione non invia mai email automaticamente.</li><li><strong>Esportazione locale:</strong> TXT esporta il contenuto con la possibilità di escludere risposte citate e inoltri. EML conserva il messaggio originale completo, codifica, intestazioni, formattazione e allegati, senza filtrare le citazioni. L’esportazione non usa l’IA né consuma token. Scegli cartella e applicazione desktop; il file viene selezionato nel gestore file per trascinarlo o allegarlo manualmente a una chat. Non viene allegato o inviato automaticamente e rimane disponibile dopo la chiusura della finestra.</li><li><strong>Cache persistente:</strong> Riassunti e traduzioni corrispondenti vengono riutilizzati alla riapertura, anche dopo il riavvio di Thunderbird. Riprova richiede un nuovo risultato e aggiorna la cache. Nelle impostazioni puoi vedere le dimensioni, aprire la cartella o svuotarla; i file esportati si eliminano separatamente.</li><li><strong>Dieci lingue dell’interfaccia:</strong> inglese, tedesco, francese, italiano, spagnolo, portoghese, cinese semplificato e tradizionale, giapponese e coreano.</li></ul><h2>Automazione facoltativa per i nuovi messaggi</h2><p>Riassunti ed etichette automatici sono <strong>disattivati per impostazione predefinita in tutti gli account</strong>. Abilitali separatamente dal menu dell’assistente IA facendo clic destro sull’account. Vengono elaborati solo i nuovi messaggi ricevuti nella posta in arrivo degli account abilitati, senza scansione della cronologia; i messaggi già contrassegnati come spam vengono ignorati.</p><p>I riassunti automatici vengono salvati nella cache per consultarli in seguito. Le etichette automatiche vengono applicate direttamente usando etichette esistenti e alias, senza confermare ogni messaggio come per i suggerimenti manuali. L’automazione usa il fornitore, il modello e la lingua di output scelti, invia il contenuto al servizio e ne consuma la quota. Il limite predefinito per i riassunti automatici è di 100 tentativi per account al giorno, modificabile nelle impostazioni. Contano anche i tentativi falliti o annullati. Il limite non riguarda le etichette automatiche.</p><p>Riassunti, traduzioni ed etichette elaborano oggetto e corpo del messaggio, non il contenuto degli allegati. Verifica i risultati dell’IA prima di usarli.</p><h2>Fornitori e privacy</h2><p>Supporta autorizzazione ChatGPT, Gemini API e Claude API. Per tradurre: Google Cloud Translation, Azure Translator o DeepL; senza servizio configurato usa il modello IA scelto. Nessun cambio di fornitore dopo un errore. Accesso e costi dipendono dal fornitore. I contenuti pertinenti passano tramite il programma Windows al servizio scelto. Credenziali protette con DPAPI; cache ed esportazioni leggibili localmente. Vedi <a href=\"https://github.com/lvbeck/mail-ai-assist/blob/main/publication/PRIVACY.md\">privacy</a>.</p>", "es": "<p>Mail AI Assist te ayuda con los correos que seleccionas en Thunderbird: resúmenes, traducción, sugerencias de etiquetas, reescritura del texto seleccionado al redactar y exportación local. No analiza por iniciativa propia todo el buzón. Los resúmenes y las etiquetas automáticos solo se generan para mensajes nuevos de la bandeja de entrada de las cuentas donde habilites expresamente cada función.</p><h2>Funciones</h2><ul><li><strong>Resúmenes:</strong> Extrae los puntos principales y las tareas pendientes del mensaje seleccionado. El idioma del resumen es independiente de los de la interfaz y la traducción; por defecto sigue el idioma del sistema.</li><li><strong>Traducción:</strong> Elige los idiomas de origen y destino o detecta automáticamente el de origen. Configura Google Cloud Translation, Microsoft Azure Translator o DeepL con tu propia clave API. Sin un servicio configurado, se usa el modelo de IA seleccionado.</li><li><strong>Etiquetas y alias:</strong> Prioriza las etiquetas existentes de Thunderbird para reducir duplicados similares. Revisa y edita las sugerencias manuales antes de confirmarlas. Por ejemplo, asocia <code>Project Alpha</code> y <code>Project Beta</code> con la etiqueta existente <code>Projects</code>. Las reglas comparan nombres completos e ignoran mayúsculas y espacios adicionales.</li><li><strong>Reescritura del texto seleccionado:</strong> Selecciona texto al redactar o responder, revisa la vista previa y confirma su sustitución. La extensión nunca envía correos automáticamente.</li><li><strong>Exportación local:</strong> TXT exporta el contenido y permite excluir respuestas citadas y reenvíos. EML conserva el mensaje original completo, su codificación, cabeceras, formato y adjuntos, sin filtrar las citas. Exportar no llama a la IA ni consume tokens. Elige la carpeta y la aplicación de escritorio; el archivo queda seleccionado en el explorador para arrastrarlo o adjuntarlo manualmente a una conversación. No se adjunta ni se envía automáticamente. Los archivos se conservan al cerrar el diálogo.</li><li><strong>Caché persistente:</strong> Al volver a abrir un resultado se reutilizan los resúmenes y traducciones coincidentes, incluso tras reiniciar Thunderbird. Reintentar solicita un resultado nuevo y actualiza la caché. En los ajustes puedes consultar su tamaño, abrir su carpeta o vaciarla; los archivos exportados se limpian por separado.</li><li><strong>Diez idiomas de interfaz:</strong> inglés, alemán, francés, italiano, español, portugués, chino simplificado y tradicional, japonés y coreano.</li></ul><h2>Automatización opcional de mensajes nuevos</h2><p>Los resúmenes y las etiquetas automáticos están <strong>desactivados por defecto en todas las cuentas</strong>. Actívalos por separado desde el menú del asistente IA al hacer clic derecho en una cuenta. Solo se procesan mensajes recién recibidos en la bandeja de entrada de cuentas habilitadas, sin analizar correos históricos; se omiten los ya marcados como correo no deseado.</p><p>Los resúmenes automáticos se guardan en caché para consultarlos después. Las etiquetas automáticas se aplican directamente según las etiquetas existentes y los alias, sin confirmar cada mensaje como con las sugerencias manuales. Se usan el proveedor, el modelo y el idioma de salida seleccionados; el contenido se envía al servicio y consume su cuota. El límite predeterminado de resúmenes automáticos es de 100 intentos por cuenta y día, configurable en los ajustes. Los intentos fallidos o cancelados también cuentan. Este límite no se aplica a las etiquetas automáticas.</p><p>Los resúmenes, las traducciones y las etiquetas procesan el asunto y el cuerpo del mensaje, no el contenido de los adjuntos. Revisa los resultados de la IA antes de utilizarlos.</p><h2>Proveedores y privacidad</h2><p>Admite autorización ChatGPT, Gemini API y Claude API. Traducción con Google Cloud Translation, Azure Translator o DeepL; sin servicio configurado usa el modelo IA elegido. Los errores no cambian de proveedor. Acceso y costes dependen del servicio. El contenido pertinente pasa por el asistente Windows al proveedor. Credenciales protegidas con DPAPI; caché y exportaciones legibles localmente. Consulta la <a href=\"https://github.com/lvbeck/mail-ai-assist/blob/main/publication/PRIVACY.md\">política</a>.</p>", "pt": "<p>O Mail AI Assist ajuda a tratar as mensagens que seleciona no Thunderbird: resumos, tradução, sugestões de etiquetas, reformulação do texto selecionado durante a composição e exportação local. Não analisa autonomamente toda a caixa de correio. Os resumos e as etiquetas automáticos aplicam-se apenas às novas mensagens da caixa de entrada das contas onde ativar explicitamente cada função.</p><h2>Funcionalidades</h2><ul><li><strong>Resumos:</strong> Extraia os pontos principais e as tarefas a realizar da mensagem selecionada. O idioma do resumo é independente dos idiomas da interface e da tradução; por predefinição, segue o sistema.</li><li><strong>Tradução:</strong> Escolha os idiomas de origem e destino ou detete automaticamente o idioma de origem. Configure Google Cloud Translation, Microsoft Azure Translator ou DeepL com a sua chave API. Sem um serviço configurado, é utilizado o modelo de IA selecionado.</li><li><strong>Etiquetas e aliases:</strong> Dê prioridade às etiquetas existentes do Thunderbird para reduzir duplicados semelhantes. Reveja e edite as sugestões manuais antes de confirmar. Associe, por exemplo, <code>Project Alpha</code> e <code>Project Beta</code> à etiqueta existente <code>Projects</code>. As regras comparam nomes completos e ignoram maiúsculas, minúsculas e espaços adicionais.</li><li><strong>Reformulação do texto selecionado:</strong> Selecione texto ao escrever ou responder, reveja a pré-visualização e confirme a substituição. A extensão nunca envia mensagens automaticamente.</li><li><strong>Exportação local:</strong> TXT exporta o conteúdo e permite excluir respostas citadas e reencaminhamentos. EML preserva a mensagem original completa, codificação, cabeçalhos, formatação e anexos, sem filtrar citações. A exportação não utiliza IA nem consome tokens. Escolha a pasta e a aplicação de ambiente de trabalho; o ficheiro fica selecionado no explorador para o arrastar ou anexar manualmente a uma conversa. Não é anexado nem enviado automaticamente. Fechar a janela mantém os ficheiros.</li><li><strong>Cache persistente:</strong> Os resumos e as traduções correspondentes são reutilizados ao reabrir, mesmo após reiniciar o Thunderbird. Tentar novamente solicita um novo resultado e atualiza a cache. Nas definições pode consultar o tamanho, abrir a pasta ou limpar a cache; os ficheiros exportados são limpos separadamente.</li><li><strong>Dez idiomas de interface:</strong> inglês, alemão, francês, italiano, espanhol, português, chinês simplificado e tradicional, japonês e coreano.</li></ul><h2>Automatização opcional para novas mensagens</h2><p>Os resumos e as etiquetas automáticos estão <strong>desativados por predefinição em todas as contas</strong>. Ative cada função separadamente no menu do assistente de IA, clicando com o botão direito numa conta. Só são tratadas novas mensagens recebidas na caixa de entrada das contas ativadas, sem analisar o histórico; mensagens já marcadas como lixo são ignoradas.</p><p>Os resumos automáticos ficam em cache para consulta posterior. As etiquetas automáticas são aplicadas diretamente com base nas etiquetas existentes e nos aliases, sem confirmação por mensagem, ao contrário das sugestões manuais. A automatização usa o fornecedor, modelo e idioma de saída selecionados, envia o conteúdo ao serviço e consome a respetiva quota. O limite predefinido de resumos automáticos é de 100 tentativas por conta e por dia, ajustável nas definições. Tentativas falhadas ou canceladas também contam. Este limite não se aplica às etiquetas automáticas.</p><p>Os resumos, traduções e etiquetas tratam o assunto e o corpo da mensagem, não o conteúdo dos anexos. Reveja os resultados da IA antes de os utilizar.</p><h2>Fornecedores e privacidade</h2><p>Suporta autorização ChatGPT, Gemini API e Claude API. Tradução com Google Cloud Translation, Azure Translator ou DeepL; sem serviço configurado utiliza o modelo IA selecionado. Erros não mudam o fornecedor. Acesso e custos dependem do serviço. Conteúdos relevantes passam pelo assistente Windows ao fornecedor. Credenciais protegidas por DPAPI; cache e exportações legíveis localmente. Consulte a <a href=\"https://github.com/lvbeck/mail-ai-assist/blob/main/publication/PRIVACY.md\">política</a>.</p>", "zh-CN": "<p>Mail AI Assist 为 Thunderbird 中用户选中的邮件提供摘要、翻译、标签建议和本地导出，并支持改写新建或回复邮件时选中的文字。插件不会主动扫描整个邮箱；只有在用户明确为某个账户启用相应功能后，才会为该账户收件箱中新收到的邮件自动生成摘要或添加标签。</p><h2>功能介绍</h2><ul><li><strong>邮件摘要：</strong> 对选中的邮件生成重点概述和待办事项。摘要语言独立于界面语言及翻译语言，默认跟随系统，也可在设置中指定。</li><li><strong>邮件翻译：</strong> 可指定原文及目标语言，或自动识别原文语言。支持使用自己的 API Key 配置谷歌翻译 API、微软翻译（Azure）或 DeepL；未配置翻译服务时使用当前 AI 模型。</li><li><strong>标签建议与别名：</strong> 优先复用 Thunderbird 中已有的标签，减少近似标签重复创建。手动生成的建议可编辑，确认后才添加。在设置中可将 <code>Project Alpha</code>、<code>Project Beta</code> 等别名映射到已有的 <code>Projects</code> 标签；规则忽略大小写及多余空格，按完整名称匹配。</li><li><strong>选中文字改写：</strong> 在新建或回复邮件窗口中选择文字，生成改写结果并预览，由你确认后替换选区。插件不会自动发送邮件。</li><li><strong>本地邮件导出：</strong> TXT 导出邮件内容，可排除引用回复和转发内容；EML 保留完整原始邮件、编码、邮件头、排版及附件，不过滤引用。导出本身不调用 AI、不消耗 Token。可选择导出目录和目标桌面应用，导出后在文件夹中选中文件，由你手动拖入或附加到聊天；插件不自动附加或发送文件。关闭对话框后保留导出文件。</li><li><strong>持久缓存：</strong> 再次打开摘要或翻译时优先显示匹配的缓存，重启 Thunderbird 后仍有效。点击“重试”才请求重新生成并更新缓存。设置中可查看缓存占用、打开缓存文件夹或清除缓存；导出文件另有独立清理功能。</li><li><strong>十种界面语言：</strong> 英语、德语、法语、意大利语、西班牙语、葡萄牙语、简体中文、繁体中文、日语和韩语。</li></ul><h2>可选的新邮件自动处理</h2><p>所有账户的自动摘要和自动标签均<strong>默认关闭</strong>。右键点击 Thunderbird 中的账户名称，在“AI 助手”菜单中分别开启所需功能。仅处理已启用账户收件箱中新收到的邮件，不回扫历史邮件，并跳过已标记为垃圾邮件的邮件。</p><p>自动摘要保存在缓存中，供之后打开查看。自动标签会依据已有标签及别名规则直接应用到邮件，无需像手动标签建议一样逐封确认。自动处理使用当前选择的服务商、模型及相应输出语言，会将邮件内容发送到所选服务并消耗额度。自动摘要默认每账户每天最多尝试 100 次，可在设置中调整；失败或取消的尝试也计入次数。此限额仅用于自动摘要，不适用于自动标签。</p><p>摘要、翻译和标签功能处理邮件主题及正文，不读取附件内容。AI 结果可能有误，使用前请核对。</p><h2>服务商与隐私</h2><p>支持 ChatGPT 授权、Gemini API、Claude API。翻译可选谷歌翻译 API、Azure Translator、DeepL；未选择或未配置翻译服务时使用当前 AI 模型，服务失败不自动切换。账户资格和费用以服务商为准。相关邮件内容通过 Windows 辅助程序发送到所选服务商；凭据使用 Windows DPAPI，缓存和导出文件在本机可读。详见<a href=\"https://github.com/lvbeck/mail-ai-assist/blob/main/publication/PRIVACY.md\">隐私政策</a>。</p>", "zh-TW": "<p>Mail AI Assist 為 Thunderbird 中使用者選取的郵件提供摘要、翻譯、標籤建議與本機匯出，並支援改寫撰寫新郵件或回覆時選取的文字。擴充套件不會主動掃描整個信箱；只有在使用者明確為某個帳戶啟用對應功能後，才會為該帳戶收件匣中新收到的郵件自動產生摘要或新增標籤。</p><h2>功能介紹</h2><ul><li><strong>郵件摘要：</strong> 為選取的郵件整理重點與待辦事項。摘要語言獨立於介面及翻譯語言，預設跟隨系統，也可在設定中指定。</li><li><strong>郵件翻譯：</strong> 可指定來源與目標語言，或自動偵測來源語言。支援以自己的 API Key 設定 Google Cloud Translation、Microsoft Azure Translator 或 DeepL；未設定翻譯服務時使用目前的 AI 模型。</li><li><strong>標籤建議與別名：</strong> 優先重用 Thunderbird 既有標籤，減少建立近似標籤。手動建議可編輯，確認後才套用。可在設定中將 <code>Project Alpha</code>、<code>Project Beta</code> 等別名對應至既有的 <code>Projects</code> 標籤；依完整名稱比對，忽略大小寫與多餘空格。</li><li><strong>選取文字改寫：</strong> 在撰寫或回覆視窗中選取文字，產生改寫並預覽，確認後才取代選取內容。擴充套件不會自動寄送郵件。</li><li><strong>本機郵件匯出：</strong> TXT 匯出郵件內容，可排除引用回覆及轉寄內容；EML 保留完整原始郵件、編碼、標頭、排版及附件，不過濾引用。匯出本身不呼叫 AI、不消耗 Token。可選擇匯出資料夾與目標桌面應用程式，並在檔案總管中選取匯出的檔案，由你手動拖入或附加至聊天；不會自動附加或傳送檔案。關閉對話框後保留檔案。</li><li><strong>持久快取：</strong> 再次開啟摘要或翻譯時重用相符的快取，重新啟動 Thunderbird 後仍有效。按「重試」才重新請求並更新快取。設定中可查看大小、開啟快取資料夾或清除快取；匯出檔案另有獨立清理功能。</li><li><strong>十種介面語言：</strong> 英文、德文、法文、義大利文、西班牙文、葡萄牙文、簡體中文、繁體中文、日文與韓文。</li></ul><h2>可選的新郵件自動處理</h2><p>所有帳戶的自動摘要與自動標籤均<strong>預設關閉</strong>。在 Thunderbird 的帳戶名稱上按右鍵，透過「AI 助手」選單分別啟用。僅處理已啟用帳戶收件匣中新收到的郵件，不掃描歷史郵件，並略過已標記為垃圾郵件的郵件。</p><p>自動摘要儲存至快取，供稍後檢視。自動標籤依既有標籤與別名規則直接套用，不像手動建議需要逐封確認。自動處理使用目前選擇的服務商、模型及對應輸出語言，會將郵件內容傳送至該服務並消耗額度。自動摘要預設每個帳戶每天最多嘗試 100 次，可在設定中調整；失敗或取消也計入次數。此限制僅適用於自動摘要，不適用於自動標籤。</p><p>摘要、翻譯與標籤處理郵件主旨及內文，不讀取附件內容。AI 結果可能有誤，使用前請核對。</p><h2>服務商與隱私</h2><p>支援 ChatGPT 授權、Gemini API、Claude API。翻譯可選 Google Cloud Translation、Azure Translator、DeepL；未選取或未設定翻譯服務時使用目前 AI 模型，服務失敗不自動切換。帳戶資格與費用依服務商而定。相關郵件內容經 Windows 輔助程式傳送至所選服務商；憑證使用 Windows DPAPI，快取與匯出檔案可在本機讀取。詳見<a href=\"https://github.com/lvbeck/mail-ai-assist/blob/main/publication/PRIVACY.md\">隱私權政策</a>。</p>", "ja": "<p>Mail AI Assist は、Thunderbird で選択したメールの要約、翻訳、タグの提案、ローカルへのエクスポートに加え、新規作成・返信時に選択した文章の書き換えを支援します。メールボックス全体を自動的にスキャンすることはありません。自動要約と自動タグ付けは、ユーザーが各機能を明示的に有効にしたアカウントの受信トレイに届く新着メールだけを対象にします。</p><h2>機能</h2><ul><li><strong>メール要約：</strong> 選択したメールの要点や対応事項を整理します。要約言語は表示言語・翻訳言語とは別に設定でき、既定ではシステム言語に従います。</li><li><strong>メール翻訳：</strong> 原文と翻訳先の言語を指定するか、原文の言語を自動検出できます。自分の API キーで Google Cloud Translation、Microsoft Azure Translator、DeepL を設定できます。翻訳サービスが未設定の場合は選択中の AI モデルを使用します。</li><li><strong>タグの提案と別名：</strong> Thunderbird の既存タグを優先し、似たタグの重複作成を減らします。手動の提案は編集してから確定できます。例えば <code>Project Alpha</code> と <code>Project Beta</code> を既存の <code>Projects</code> タグに対応付けられます。別名は名前全体で照合し、大文字・小文字や余分な空白を区別しません。</li><li><strong>選択した文章の書き換え：</strong> 新規作成・返信ウィンドウで文章を選択し、書き換え結果をプレビューしてから置き換えを確定します。メールを自動送信することはありません。</li><li><strong>ローカルエクスポート：</strong> TXT はメール内容を出力し、引用された返信や転送内容を除外できます。EML は元のメール全体、文字コード、ヘッダー、書式、添付ファイルを保持し、引用を除外しません。エクスポート自体は AI を呼び出さず、トークンも消費しません。保存先とデスクトップアプリを選択でき、ファイルマネージャーで出力ファイルを選択した状態にします。チャットへのドラッグや添付は手動で行い、自動添付・送信はしません。ダイアログを閉じてもファイルは残ります。</li><li><strong>永続キャッシュ：</strong> 再度開く際は一致する要約・翻訳を再利用し、Thunderbird 再起動後も保持します。再試行すると新しい結果を要求し、キャッシュを更新します。設定で使用量の確認、フォルダーの表示、キャッシュの削除ができ、エクスポートファイルは別途整理できます。</li><li><strong>10 種類の表示言語：</strong> 英語、ドイツ語、フランス語、イタリア語、スペイン語、ポルトガル語、簡体字中国語、繁体字中国語、日本語、韓国語。</li></ul><h2>新着メールの自動処理（任意）</h2><p>自動要約と自動タグ付けは、すべてのアカウントで<strong>既定では無効</strong>です。Thunderbird のアカウントを右クリックし、AI アシスタントのメニューから個別に有効にします。有効なアカウントの受信トレイに新しく届いたメールのみを処理し、過去のメールをスキャンせず、既に迷惑メールと判定されたメールはスキップします。</p><p>自動要約は後で表示するためにキャッシュへ保存します。自動タグ付けは既存タグと別名ルールに基づいて直接適用され、手動の提案とは異なり、メールごとの確認はありません。選択中のプロバイダー、モデル、各出力言語を使用し、メール内容をサービスへ送信して利用枠を消費します。自動要約の上限は既定でアカウントごとに 1 日 100 回の試行で、設定で変更できます。失敗・キャンセルも回数に含まれます。この上限は自動タグ付けには適用されません。</p><p>要約・翻訳・タグ付けは件名と本文を処理し、添付ファイルの内容は読み取りません。AI の結果には誤りがあり得るため、利用前に確認してください。</p><h2>提供元とプライバシー</h2><p>ChatGPT 認証、Gemini API、Claude API を選択できます。翻訳は Google Cloud Translation、Azure Translator、DeepL に対応し、翻訳サービスが未選択または未設定の場合は選択した AI モデルを使用します。サービスの失敗時に自動で別の提供元へ切り替えません。利用条件と料金は提供元によって異なります。関連するメール内容は Windows ヘルパー経由で選択したサービスに送信します。認証情報は Windows DPAPI で保護します。キャッシュとエクスポートは読み取り可能なローカルファイルです。<a href=\"https://github.com/lvbeck/mail-ai-assist/blob/main/publication/PRIVACY.md\">プライバシーポリシー</a>を参照してください。</p>", "ko": "<p>Mail AI Assist는 Thunderbird에서 선택한 메일의 요약, 번역, 태그 제안, 로컬 내보내기를 지원하며, 새 메일이나 답장을 작성할 때 선택한 문구를 다시 작성할 수 있습니다. 전체 메일함을 임의로 스캔하지 않습니다. 자동 요약과 자동 태그는 사용자가 각 기능을 명시적으로 켠 계정의 받은편지함에 도착하는 새 메일에만 적용됩니다.</p><h2>기능</h2><ul><li><strong>메일 요약:</strong> 선택한 메일의 핵심 내용과 해야 할 일을 정리합니다. 요약 언어는 인터페이스 및 번역 언어와 별도로 설정하며, 기본값은 시스템 언어 따르기입니다.</li><li><strong>메일 번역:</strong> 원문과 대상 언어를 선택하거나 원문 언어를 자동으로 감지합니다. 자신의 API 키로 Google Cloud Translation, Microsoft Azure Translator, DeepL을 설정할 수 있습니다. 번역 서비스를 설정하지 않으면 선택한 AI 모델을 사용합니다.</li><li><strong>태그 제안과 별칭:</strong> Thunderbird의 기존 태그를 우선 사용하여 유사한 태그의 중복 생성을 줄입니다. 수동 제안은 편집한 후 확인하여 적용합니다. 예를 들어 <code>Project Alpha</code>와 <code>Project Beta</code>를 기존 <code>Projects</code> 태그에 연결할 수 있습니다. 별칭은 전체 이름으로 비교하며 대소문자와 불필요한 공백을 무시합니다.</li><li><strong>선택한 문구 다시 작성:</strong> 새 메일 또는 답장 창에서 문구를 선택하고 결과를 미리 본 뒤 교체를 확인합니다. 확장 기능은 메일을 자동으로 보내지 않습니다.</li><li><strong>로컬 메일 내보내기:</strong> TXT는 메일 내용을 내보내며 인용된 답장과 전달 내용을 제외할 수 있습니다. EML은 원본 메일 전체, 인코딩, 헤더, 서식, 첨부파일을 보존하며 인용 내용을 제외하지 않습니다. 내보내기 자체는 AI를 호출하거나 토큰을 소비하지 않습니다. 저장 폴더와 데스크톱 앱을 선택할 수 있으며, 파일 탐색기에서 내보낸 파일을 선택해 줍니다. 채팅에 끌어 놓거나 첨부하는 작업은 직접 수행하며, 자동 첨부나 전송은 하지 않습니다. 대화상자를 닫아도 파일은 유지됩니다.</li><li><strong>영구 캐시:</strong> 다시 열 때 일치하는 요약과 번역을 재사용하며 Thunderbird를 재시작해도 유지됩니다. 재시도를 누르면 새 결과를 요청하고 캐시를 갱신합니다. 설정에서 사용량 확인, 폴더 열기, 캐시 삭제가 가능하며 내보낸 파일은 별도로 정리합니다.</li><li><strong>10가지 인터페이스 언어:</strong> 영어, 독일어, 프랑스어, 이탈리아어, 스페인어, 포르투갈어, 중국어 간체 및 번체, 일본어, 한국어.</li></ul><h2>새 메일 자동 처리 (선택 사항)</h2><p>모든 계정의 자동 요약과 자동 태그는 <strong>기본적으로 꺼져 있습니다</strong>. Thunderbird에서 계정을 마우스 오른쪽 버튼으로 클릭하고 AI 도우미 메뉴에서 각각 켤 수 있습니다. 활성화한 계정의 받은편지함에 새로 도착한 메일만 처리하며, 과거 메일을 스캔하지 않고 이미 스팸으로 표시된 메일은 건너뜁니다.</p><p>자동 요약은 나중에 볼 수 있도록 캐시에 저장됩니다. 자동 태그는 기존 태그와 별칭 규칙에 따라 직접 적용되며, 수동 제안과 달리 메일마다 확인하지 않습니다. 선택한 제공업체, 모델, 해당 출력 언어를 사용하며 메일 내용을 서비스에 전송하고 이용 한도를 소비합니다. 자동 요약의 기본 제한은 계정당 하루 100회 시도이며 설정에서 변경할 수 있습니다. 실패하거나 취소한 시도도 포함됩니다. 이 제한은 자동 태그에는 적용되지 않습니다.</p><p>요약, 번역, 태그 기능은 메일 제목과 본문을 처리하며 첨부파일 내용은 읽지 않습니다. AI 결과에는 오류가 있을 수 있으므로 사용 전에 확인하세요.</p><h2>제공업체 및 개인정보</h2><p>ChatGPT 인증, Gemini API 또는 Claude API를 선택할 수 있습니다. 번역은 Google Cloud Translation, Azure Translator 및 DeepL을 지원합니다. 번역 서비스를 선택하거나 설정하지 않으면 선택한 AI 모델을 사용합니다. 서비스 실패 시 다른 제공업체로 자동 전환하지 않습니다. 이용 자격과 요금은 제공업체에 따라 다릅니다. 관련 메일 내용은 Windows 도우미를 통해 선택한 서비스로 전송됩니다. 인증 정보는 Windows DPAPI로 보호합니다. 캐시와 내보낸 파일은 읽을 수 있는 로컬 파일입니다. <a href=\"https://github.com/lvbeck/mail-ai-assist/blob/main/publication/PRIVACY.md\">개인정보 처리방침</a>을 확인하세요.</p>"};
function matchLanguage(value){const tag=String(value||'').replaceAll('_','-').toLowerCase();if(tag.startsWith('zh'))return /hant|tw|hk|mo/.test(tag)?'zh-TW':'zh-CN';const base=tag.split('-')[0];return Object.hasOwn(texts,base)?base:'en';}
const selector=document.getElementById('language');
selector.value=matchLanguage(navigator.language);

function render(){const lang=selector.value;document.getElementById('featureOverview').innerHTML=overviews[lang];document.documentElement.lang=lang;document.title='Mail AI Assist · '+texts[lang][0];document.getElementById('languageLabel').textContent=labels[lang];['title','intro','download','step2','step3','updates','uninstall'].forEach((id,i)=>document.getElementById(id).textContent=texts[lang][i]);}
selector.addEventListener('change',render);render();
</script></body></html>
