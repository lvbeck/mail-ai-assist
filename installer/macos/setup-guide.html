<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mail AI Assist · macOS</title><style>body{font:16px/1.7 system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 24px;color:#253149;background:#f7f9fc}a{color:#4856c6}select{font:inherit;padding:8px}section{background:white;border:1px solid #dce2ee;padding:24px;border-radius:16px}</style></head><body><h1>Mail AI Assist · macOS</h1><select id="language" aria-label="Language"></select><section><p id="setup"></p><p id="updates"></p><p id="notice"></p><p><a href="https://github.com/lvbeck/mail-ai-assist/releases">GitHub Releases · XPI / PKG</a></p><p><a href="https://github.com/lvbeck/mail-ai-assist/blob/main/publication/PRIVACY.md">Privacy policy</a></p><p>~/Library/Application Support/MailAiAssist</p></section><script>
const messages={"en": ["Install the macOS helper (PKG) matching your Mac: Apple Silicon or Intel. Restart Thunderbird, then sign in or enter an API key.", "Download helper (macOS)", "Local helper unavailable. Install the matching macOS PKG from Settings, then restart Thunderbird.", "Install the latest macOS helper PKG, then restart Thunderbird.", "Application path (.app)", "Thunderbird manages add-on updates. The helper uses a separate signed update channel. Install the add-on only once.", "A helper update is ready. Click Install to open macOS Installer; close Thunderbird before completing installation.", "Complete the update in macOS Installer, approve authorization if requested, then restart Thunderbird."], "zh-CN": ["请单独安装与你的 Mac 匹配的 macOS 辅助程序（PKG）：Apple Silicon 或 Intel。重启 Thunderbird 后再登录或填写 API Key。", "下载辅助程序（macOS）", "本地辅助程序未连接。请在设置页下载并安装匹配的 macOS PKG，然后重启 Thunderbird。", "请安装最新版 macOS 辅助程序 PKG，然后重启 Thunderbird。", "应用程序路径（.app）", "Thunderbird 管理插件更新；辅助程序使用独立的签名更新渠道。插件只需安装一次。", "辅助程序更新已就绪。点击安装以打开 macOS 安装器；完成安装前请关闭 Thunderbird。", "请在 macOS 安装器中完成更新，按提示授权，然后重启 Thunderbird。"], "zh-TW": ["請另外安裝與你的 Mac 相符的 macOS 輔助程式（PKG）：Apple Silicon 或 Intel。重新啟動 Thunderbird 後再登入或填入 API Key。", "下載輔助程式（macOS）", "本機輔助程式未連線。請在設定頁下載並安裝相符的 macOS PKG，然後重新啟動 Thunderbird。", "請安裝最新版 macOS 輔助程式 PKG，然後重新啟動 Thunderbird。", "應用程式路徑（.app）", "Thunderbird 管理附加元件更新；輔助程式使用獨立的簽章更新管道。附加元件只需安裝一次。", "輔助程式更新已就緒。按下安裝以開啟 macOS 安裝程式；完成安裝前請關閉 Thunderbird。", "請在 macOS 安裝程式中完成更新，依提示授權，然後重新啟動 Thunderbird。"], "de": ["Installieren Sie das macOS-Hilfsprogramm (PKG) passend zu Ihrem Mac: Apple Silicon oder Intel. Starten Sie Thunderbird neu und melden Sie sich an oder geben Sie einen API-Schlüssel ein.", "Hilfsprogramm herunterladen (macOS)", "Lokales Hilfsprogramm nicht verfügbar. Installieren Sie das passende macOS-PKG über die Einstellungen und starten Sie Thunderbird neu.", "Installieren Sie das aktuelle macOS-Hilfsprogramm als PKG und starten Sie Thunderbird neu.", "Anwendungspfad (.app)", "Thunderbird verwaltet Add-on-Updates. Das Hilfsprogramm verwendet einen separaten signierten Updatekanal. Installieren Sie das Add-on nur einmal.", "Ein Update ist bereit. Klicken Sie auf Installieren, um das macOS-Installationsprogramm zu öffnen. Schließen Sie Thunderbird vor Abschluss der Installation.", "Schließen Sie das Update im macOS-Installationsprogramm ab, bestätigen Sie bei Bedarf die Berechtigung und starten Sie Thunderbird neu."], "fr": ["Installez l’assistant macOS (PKG) adapté à votre Mac : Apple Silicon ou Intel. Redémarrez Thunderbird, puis connectez-vous ou saisissez une clé API.", "Télécharger l’assistant (macOS)", "Assistant local indisponible. Installez le PKG macOS adapté depuis les paramètres, puis redémarrez Thunderbird.", "Installez le dernier PKG de l’assistant macOS, puis redémarrez Thunderbird.", "Chemin de l’application (.app)", "Thunderbird gère les mises à jour du module. L’assistant utilise un canal de mise à jour signé distinct. Installez le module une seule fois.", "Une mise à jour est prête. Cliquez sur Installer pour ouvrir le programme d’installation macOS ; fermez Thunderbird avant de terminer.", "Terminez la mise à jour dans le programme d’installation macOS, autorisez-la si nécessaire, puis redémarrez Thunderbird."], "it": ["Installa il programma ausiliario macOS (PKG) adatto al tuo Mac: Apple Silicon o Intel. Riavvia Thunderbird, quindi accedi o inserisci una chiave API.", "Scarica il programma ausiliario (macOS)", "Programma ausiliario locale non disponibile. Installa il PKG macOS corretto dalle impostazioni, quindi riavvia Thunderbird.", "Installa il PKG più recente del programma ausiliario macOS, quindi riavvia Thunderbird.", "Percorso applicazione (.app)", "Thunderbird gestisce gli aggiornamenti del componente aggiuntivo. Il programma ausiliario usa un canale firmato separato. Installa il componente aggiuntivo una sola volta.", "Un aggiornamento è pronto. Fai clic su Installa per aprire Installer di macOS; chiudi Thunderbird prima di completare l’installazione.", "Completa l’aggiornamento in Installer di macOS, autorizzalo se richiesto e riavvia Thunderbird."], "es": ["Instala el programa auxiliar de macOS (PKG) adecuado para tu Mac: Apple Silicon o Intel. Reinicia Thunderbird e inicia sesión o introduce una clave API.", "Descargar auxiliar (macOS)", "Auxiliar local no disponible. Instala el PKG de macOS adecuado desde Configuración y reinicia Thunderbird.", "Instala el PKG más reciente del auxiliar de macOS y reinicia Thunderbird.", "Ruta de la aplicación (.app)", "Thunderbird gestiona las actualizaciones del complemento. El auxiliar usa un canal firmado independiente. Instala el complemento una sola vez.", "Hay una actualización lista. Pulsa Instalar para abrir el instalador de macOS; cierra Thunderbird antes de finalizar.", "Completa la actualización en el instalador de macOS, autoriza si se solicita y reinicia Thunderbird."], "pt": ["Instale o auxiliar macOS (PKG) adequado ao seu Mac: Apple Silicon ou Intel. Reinicie o Thunderbird e inicie sessão ou introduza uma chave API.", "Transferir auxiliar (macOS)", "Auxiliar local indisponível. Instale o PKG macOS adequado nas Definições e reinicie o Thunderbird.", "Instale o PKG mais recente do auxiliar macOS e reinicie o Thunderbird.", "Caminho da aplicação (.app)", "O Thunderbird gere as atualizações do extra. O auxiliar utiliza um canal assinado separado. Instale o extra apenas uma vez.", "Está pronta uma atualização. Clique em Instalar para abrir o instalador macOS; feche o Thunderbird antes de concluir.", "Conclua a atualização no instalador macOS, autorize se solicitado e reinicie o Thunderbird."], "ja": ["お使いの Mac に合う macOS ヘルパー（PKG）を別途インストールしてください：Apple Silicon または Intel。Thunderbird を再起動してからログインするか API キーを入力してください。", "ヘルパーをダウンロード（macOS）", "ローカルヘルパーに接続できません。設定から対応する macOS PKG をインストールし、Thunderbird を再起動してください。", "最新版の macOS ヘルパー PKG をインストールし、Thunderbird を再起動してください。", "アプリケーションのパス（.app）", "アドオンの更新は Thunderbird が管理します。ヘルパーには別の署名付き更新経路があります。アドオンのインストールは一度だけで十分です。", "ヘルパーの更新が準備できました。「インストール」で macOS インストーラを開きます。完了前に Thunderbird を終了してください。", "macOS インストーラで更新を完了し、必要な許可を与えてから Thunderbird を再起動してください。"], "ko": ["Mac에 맞는 macOS 도우미(PKG)를 별도로 설치하세요: Apple Silicon 또는 Intel. Thunderbird를 다시 시작한 후 로그인하거나 API 키를 입력하세요.", "도우미 다운로드(macOS)", "로컬 도우미에 연결할 수 없습니다. 설정에서 알맞은 macOS PKG를 설치한 후 Thunderbird를 다시 시작하세요.", "최신 macOS 도우미 PKG를 설치한 후 Thunderbird를 다시 시작하세요.", "애플리케이션 경로(.app)", "Thunderbird가 부가 기능 업데이트를 관리합니다. 도우미는 별도의 서명된 업데이트 채널을 사용합니다. 부가 기능은 한 번만 설치하세요.", "도우미 업데이트가 준비되었습니다. 설치를 눌러 macOS 설치 프로그램을 열고, 완료하기 전에 Thunderbird를 종료하세요.", "macOS 설치 프로그램에서 업데이트를 완료하고 요청 시 권한을 승인한 후 Thunderbird를 다시 시작하세요."]};
const notices={"en": "The source includes Apple Silicon (arm64) and Intel (x64) helper support: Keychain-protected credentials, Finder export selection and separate signed PKG updates. The existing Windows MSI/update flow is retained. macOS requires a separately built helper; an XPI alone is not sufficient. Signed/notarized PKGs and real Mac validation are still required before public macOS availability. See", "zh-CN": "源码已加入 Apple Silicon（arm64）和 Intel（x64）辅助程序支持：Keychain 凭据保护、Finder 选中导出文件和独立签名 PKG 更新。现有 Windows MSI 与更新流程保留。macOS 需要单独构建辅助程序，只有 XPI 不足以运行。公开提供 Mac 版前仍须完成 PKG 签名、公证及 Mac 实机验证。参见", "zh-TW": "原始碼已加入 Apple Silicon（arm64）與 Intel（x64）輔助程式支援：Keychain 憑據保護、Finder 選取匯出檔案及獨立簽章 PKG 更新。現有 Windows MSI 與更新流程保留。macOS 需要另行建置輔助程式，只有 XPI 無法執行。公開提供 Mac 版前仍須完成 PKG 簽章、公證及 Mac 實機驗證。參閱", "de": "Der Quellcode unterstützt Helfer für Apple Silicon (arm64) und Intel (x64): geschützte Zugangsdaten im Schlüsselbund, Exportauswahl im Finder und separate signierte PKG-Updates. Der Windows-MSI- und Updateablauf bleibt erhalten. macOS benötigt einen separat gebauten Helfer; die XPI allein genügt nicht. Signierte/notarisierte PKGs und Tests auf echten Macs stehen vor der öffentlichen Verfügbarkeit noch aus. Siehe", "fr": "Le code source inclut un assistant Apple Silicon (arm64) et Intel (x64) : identifiants protégés par le trousseau, sélection des exports dans Finder et mises à jour PKG signées distinctes. Le MSI Windows et son mécanisme de mise à jour sont conservés. macOS nécessite un assistant compilé séparément ; le XPI seul ne suffit pas. La signature, la notarisation et les tests sur de vrais Mac restent nécessaires avant publication. Voir", "it": "Il codice include il supporto per Apple Silicon (arm64) e Intel (x64): credenziali protette dal Portachiavi, selezione degli export nel Finder e aggiornamenti PKG firmati separati. MSI e aggiornamenti Windows restano invariati. macOS richiede un programma ausiliario compilato separatamente; il solo XPI non basta. Firma, notarizzazione e test su Mac reali sono ancora necessari prima della pubblicazione. Vedi", "es": "El código incluye soporte para Apple Silicon (arm64) e Intel (x64): credenciales protegidas por el Llavero, selección de archivos exportados en Finder y actualizaciones PKG firmadas independientes. Se mantienen el MSI y las actualizaciones de Windows. macOS requiere un auxiliar compilado por separado; el XPI no basta. Antes de publicarlo faltan la firma, la notarización y las pruebas en Mac reales. Consulta", "pt": "O código inclui suporte para Apple Silicon (arm64) e Intel (x64): credenciais protegidas pelo Porta-chaves, seleção das exportações no Finder e atualizações PKG assinadas separadas. O MSI e as atualizações Windows são mantidos. O macOS requer um auxiliar compilado separadamente; só o XPI não basta. Antes da publicação ainda são necessárias assinatura, notarização e validação em Macs reais. Consulte", "ja": "ソースには Apple Silicon（arm64）と Intel（x64）のヘルパー対応を追加しました。キーチェーンによる資格情報保護、Finder でのエクスポート選択、独立した署名付き PKG 更新に対応します。Windows MSI と更新方式は維持します。macOS ではヘルパーの別途ビルドが必要で、XPI だけでは動作しません。公開前に PKG の署名・公証と実機検証が必要です。", "ko": "소스에 Apple Silicon(arm64) 및 Intel(x64) 도우미 지원을 추가했습니다. 키체인 자격 증명 보호, Finder에서 내보낸 파일 선택, 별도의 서명된 PKG 업데이트를 지원합니다. Windows MSI 및 업데이트 방식은 유지됩니다. macOS는 도우미를 별도로 빌드해야 하며 XPI만으로는 작동하지 않습니다. 공개 전에 PKG 서명·공증 및 실제 Mac 검증이 필요합니다."};
const names={en:'English',de:'Deutsch',fr:'Français',it:'Italiano',es:'Español',pt:'Português','zh-CN':'简体中文','zh-TW':'繁體中文',ja:'日本語',ko:'한국어'};
const selector=document.getElementById('language');
for(const [key,label] of Object.entries(names)){const option=document.createElement('option');option.value=key;option.textContent=label;selector.append(option);}
const tag=navigator.language.toLowerCase();selector.value=tag.startsWith('zh')?(/hant|tw|hk|mo/.test(tag)?'zh-TW':'zh-CN'):(Object.hasOwn(messages,tag.split('-')[0])?tag.split('-')[0]:'en');
function render(){const language=selector.value;document.documentElement.lang=language;document.getElementById('setup').textContent=messages[language][0];document.getElementById('updates').textContent=messages[language][5]+' '+messages[language][7];document.getElementById('notice').textContent=notices[language];}
selector.addEventListener('change',render);render();
</script></body></html>
