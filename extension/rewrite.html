<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 辅助写作</title><link rel="stylesheet" href="rewrite.css"><link rel="stylesheet" href="button-icons.css"></head>
<body class="compose-page">
<main class="compose-main">
<label for="source">选中的原文 <span id="count"></span></label><textarea id="source" rows="5" readonly></textarea>

<div class="columns"><div><label for="recipe">改写方式</label><select id="recipe"><option value="polish">润色，保留原意</option><option value="formal">更正式、适合商务邮件</option><option value="concise">更简洁</option><option value="friendly">更友好、自然</option><option value="translate">翻译</option><option value="custom">自定义要求</option></select></div><div><label for="language">输出语言</label><select id="language"><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option><option value="pt">Português (Portugal)</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div>
</div>
<div id="customField" hidden><label for="custom">你的要求</label><textarea id="custom" rows="2" maxlength="2000" placeholder="例如：保留技术术语，用礼貌的德语改写"></textarea></div>
<p class="note">仅发送上方原文及改写要求，不会自动发送邮件。</p>
<div class="row"><button id="generate" class="primary" disabled>开始改写</button><button id="cancel" disabled>取消请求</button></div>
<p id="status" role="status" aria-live="polite"></p>
<label for="result">改写结果 · 可继续编辑</label><textarea id="result" rows="7" placeholder="结果将显示在这里" disabled></textarea>
<p class="note">替换为纯文字；可在邮件编辑器中按 Ctrl+Z 撤销。</p>
</main><footer><button id="settings">设置</button><span class="spacer"></span><button id="close">关闭</button><button id="apply" class="primary" disabled>替换选中文字</button></footer>
<script src="translations.js"></script><script src="localization.js"></script><script src="preview.js"></script><script src="rewrite.js"></script>
</body></html>
