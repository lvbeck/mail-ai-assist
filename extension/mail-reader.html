<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mail AI Assist</title><link rel="stylesheet" href="rewrite.css"><link rel="stylesheet" href="mail.css"><link rel="stylesheet" href="button-icons.css"></head>
<body class="mail-reader" data-page="mail">
<header><img src="icon.svg" width="32" height="32" alt=""><div><h1 id="taskTitle">邮箱 AI 助手</h1><p id="subject"></p></div></header>
<main><p class="note">仅发送当前邮件主题和正文，不处理附件。AI 结果请自行核对。</p><p id="status" role="status" aria-live="polite"></p><textarea id="mailResult" readonly aria-labelledby="taskTitle"></textarea></main>
<footer><button id="settings">设置</button><span class="spacer"></span><button id="confirmTags" class="primary" hidden disabled>确认添加标签</button><button id="undo" hidden>撤销标签</button><button id="retry" disabled>重试</button><button id="cancel" disabled>取消请求</button><button id="close">关闭</button></footer>
<script src="translations.js"></script><script src="localization.js"></script><script src="summary-instructions.js"></script><script src="tag-instructions.js"></script><script src="mail-content.js"></script><script src="mail-reader.js"></script></body></html>
